train:
  image:
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
      - _target_: torchvision.transforms.RandAugment
        magnitude: 15
inference:
  image:
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: torchvision.transforms.Resize
        size: [224, 224]
